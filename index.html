<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO LEAGUE Season 5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;700;800&display=swap" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // Firebase Configuration (လက်ရှိ အသုံးပြုနေသော ပတ်ဝန်းကျင်ဒေတာ)
        const firebaseConfig = {
            apiKey: "AIzaSyDxbrWG3bQTqFiKNZ_8rLvMPeOOj3PTWJI",
            authDomain: "the-one-community-a3a50.firebaseapp.com",
            projectId: "the-one-community-a3a50",
            storageBucket: "the-one-community-a3a50.firebasestorage.app",
            messagingSenderId: "935304206770",
            appId: "1:935304206770:web:66386d8e818f4625b1acab",
            measurementId: "G-MN34Y0XN8J"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'the-one-community-v1';

        // လူကြီးမင်း ပေးထားသော ထိပ်သီးကလပ် ၄၈ သင်းနှင့် တရားဝင် Logo URLs စာရင်း
        const fixedTeams = [
            { name: "Manchester City", logo: "https://crests.football-data.org/65.png" },
            { name: "Manchester United", logo: "https://crests.football-data.org/66.png" },
            { name: "Liverpool", logo: "https://crests.football-data.org/64.png" },
            { name: "Arsenal", logo: "https://crests.football-data.org/57.png" },
            { name: "Chelsea", logo: "https://crests.football-data.org/61.png" },
            { name: "Tottenham Hotspur", logo: "https://crests.football-data.org/73.png" },
            { name: "Newcastle United", logo: "https://crests.football-data.org/67.png" },
            { name: "Aston Villa", logo: "https://crests.football-data.org/58.png" },
            { name: "West Ham United", logo: "https://crests.football-data.org/563.png" },
            { name: "Real Madrid", logo: "https://crests.football-data.org/86.png" },
            { name: "Barcelona", logo: "https://crests.football-data.org/81.png" },
            { name: "Atletico Madrid", logo: "https://crests.football-data.org/78.png" },
            { name: "Sevilla", logo: "https://crests.football-data.org/79.png" },
            { name: "Real Sociedad", logo: "https://crests.football-data.org/89.png" },
            { name: "Villarreal", logo: "https://crests.football-data.org/94.png" },
            { name: "Real Betis", logo: "https://crests.football-data.org/90.png" },
            { name: "Inter Milan", logo: "https://crests.football-data.org/108.png" },
            { name: "AC Milan", logo: "https://crests.football-data.org/98.png" },
            { name: "Juventus", logo: "https://crests.football-data.org/109.png" },
            { name: "Napoli", logo: "https://crests.football-data.org/113.png" },
            { name: "Roma", logo: "https://crests.football-data.org/100.png" },
            { name: "Lazio", logo: "https://crests.football-data.org/110.png" },
            { name: "Atalanta", logo: "https://crests.football-data.org/102.png" },
            { name: "Bayern Munich", logo: "https://crests.football-data.org/5.png" },
            { name: "Borussia Dortmund", logo: "https://crests.football-data.org/4.png" },
            { name: "RB Leipzig", logo: "https://crests.football-data.org/17.png" },
            { name: "Bayer Leverkusen", logo: "https://crests.football-data.org/3.png" },
            { name: "Eintracht Frankfurt", logo: "https://crests.football-data.org/19.png" },
            { name: "VfB Stuttgart", logo: "https://crests.football-data.org/10.png" },
            { name: "VfL Wolfsburg", logo: "https://crests.football-data.org/11.png" },
            { name: "Paris Saint-Germain", logo: "https://crests.football-data.org/524.png" },
            { name: "Marseille", logo: "https://crests.football-data.org/516.png" },
            { name: "Lyon", logo: "https://crests.football-data.org/523.png" },
            { name: "Monaco", logo: "https://crests.football-data.org/548.png" },
            { name: "Lille", logo: "https://crests.football-data.org/521.png" },
            { name: "Nice", logo: "https://crests.football-data.org/522.png" },
            { name: "Rennes", logo: "https://crests.football-data.org/529.png" },
            { name: "Ajax", logo: "https://crests.football-data.org/678.png" },
            { name: "PSV Eindhoven", logo: "https://crests.football-data.org/674.png" },
            { name: "Feyenoord", logo: "https://crests.football-data.org/675.png" },
            { name: "Benfica", logo: "https://crests.football-data.org/1903.png" },
            { name: "Porto", logo: "https://crests.football-data.org/503.png" },
            { name: "Sporting CP", logo: "https://crests.football-data.org/498.png" },
            { name: "Celtic", logo: "https://crests.football-data.org/1914.png" },
            { name: "Rangers", logo: "https://crests.football-data.org/1915.png" },
            { name: "Galatasaray", logo: "https://crests.football-data.org/610.png" },
            { name: "Fenerbahce", logo: "https://crests.football-data.org/611.png" },
            { name: "Besiktas", logo: "https://crests.football-data.org/1885.png" }
        ];

        const initialTeams = fixedTeams.map((team, i) => ({ id: i, name: team.name, logo: team.logo }));

        // Application State စနစ်တစ်ခုလုံးကို ထိန်းချုပ်မည့် နေရာ
        window.state = {
            isAdmin: false,
            user: null,
            teams: [...initialTeams], 
            rounds: Array.from({length: 4}, (_, i) => ({ round: i + 1, matches: [] })),
            knockout: { playoffs: [], r16: [], qf: [], sf: [], final: [] },
            currentRound: 1,
            activeTab: 'standing',
            isLeagueStarted: false,
            potr: {},
            modal: {
                isOpen: false,
                title: "",
                message: "",
                onConfirm: null,
                showCancel: true
            }
        };

        const getTournamentDoc = () => doc(db, 'tournaments', appId);

        // ဒေတာများကို Firebase Cloud သို့ သိမ်းဆည်းရန်
        const saveToCloud = async () => {
            if (!window.state.user || !window.state.isAdmin) return;
            try {
                await setDoc(getTournamentDoc(), {
                    teams: window.state.teams,
                    rounds: window.state.rounds,
                    knockout: window.state.knockout,
                    isLeagueStarted: window.state.isLeagueStarted,
                    potr: window.state.potr,
                    currentRound: window.state.currentRound
                }, { merge: true });
            } catch (e) { console.error("Cloud Save Error: ", e); }
        };

        // Real-time Sync လုပ်ဆောင်ချက် (ဒေတာဘေ့စ်တွင် အမည်လွတ်နေပါက Fixed Team အမည်များနှင့် Logo များဖြင့် အလိုအလျောက် အစားထိုးမည်)
        const startSync = async () => {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    window.state.user = user;
                    onSnapshot(getTournamentDoc(), (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            if (data.teams) {
                                // DB မှ အသင်းဒေတာဟောင်းများကို Fixed အသင်းစာရင်းဖြင့် ပေါင်းစပ်ညှိနှိုင်းခြင်း
                                const mergedTeams = initialTeams.map((defaultTeam, idx) => {
                                    const dbTeam = data.teams[idx];
                                    const activeName = (dbTeam && dbTeam.name && dbTeam.name.trim() !== "") ? dbTeam.name : defaultTeam.name;
                                    // နာမည်ပြောင်းသွားလျှင် Logo ပါပြောင်းရန် သို့မဟုတ် Default Logo ကို ဆက်သုံးရန်
                                    const matchedLogo = fixedTeams.find(ft => ft.name.toLowerCase() === activeName.toLowerCase())?.logo || dbTeam?.logo || defaultTeam.logo;
                                    return {
                                        id: idx,
                                        name: activeName,
                                        logo: matchedLogo
                                    };
                                });
                                data.teams = mergedTeams;
                            } else {
                                data.teams = [...initialTeams];
                            }
                            Object.assign(window.state, data);
                            refreshUI();
                        }
                    }, (err) => console.error("Sync Error: ", err));
                }
            });
            await signInAnonymously(auth);
        };

        startSync();

        // Custom Modal စနစ် (Native Alert/Confirm အစားထိုးရန်)
        window.showModal = (title, message, onConfirm, showCancel = true) => {
            window.state.modal = {
                isOpen: true,
                title,
                message,
                onConfirm,
                showCancel
            };
            refreshUI();
        };

        window.closeModal = () => {
            window.state.modal.isOpen = false;
            refreshUI();
        };

        // UI အားလုံးကို Dynamic ပြန်လည်ရေးဆွဲပေးမည့် Function
        window.refreshUI = () => {
            const container = document.getElementById('content');
            renderNav();
            renderHeader();
            if(window.state.activeTab === 'setup') renderSetup(container);
            else if(window.state.activeTab === 'rounds') renderRounds(container);
            else if(window.state.activeTab === 'standing') renderTable(container);
            else if(window.state.activeTab === 'potr') renderPOTR(container);
            else if(window.state.activeTab === 'knockout') renderKnockout(container);
            renderModal();
            document.getElementById('loader').style.display = 'none';
        };

        window.renderNav = () => {
            const tabs = ['rounds', 'standing', 'knockout', 'potr', 'setup'];
            const labels = ['Fixtures', 'Table', 'Knockout', 'POTR', 'Admin'];
            document.getElementById('nav-bar').innerHTML = tabs.map((t, i) => {
                if (t === 'setup' && !window.state.isAdmin) return '';
                const isActive = window.state.activeTab === t;
                return `
                <button onclick="changeTab('${t}')" class="flex flex-col items-center justify-center gap-1 flex-1 h-full transition-all relative ${isActive ? 'text-blue-500 scale-110' : 'text-zinc-500'}">
                    ${isActive ? '<div class="absolute -top-1 w-8 h-1 bg-blue-500 rounded-full shadow-[0_0_15px_rgba(59,130,246,1)]"></div>' : ''}
                    <span class="text-[11px] font-black uppercase tracking-widest">${labels[i]}</span>
                </button>`;
            }).join('');
        };

        const renderTable = (container) => {
            if(!window.state.isLeagueStarted) { 
                container.innerHTML = `<div class="p-20 text-center opacity-30 italic text-sm">League Phase စတင်ရန် စောင့်ဆိုင်းနေပါသည်...</div>`; 
                return; 
            }
            
            let statsMap = {};
            window.state.teams.forEach(t => statsMap[t.id] = { id: t.id, name: t.name || `Manager ${t.id+1}`, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 });
            
            window.state.rounds.forEach(r => {
                r.matches.forEach(m => {
                    if(m.hs !== null && m.as !== null) {
                        const h = statsMap[m.h], a = statsMap[m.a];
                        if(!h || !a) return;
                        h.p++; a.p++; h.gf += m.hs; h.ga += m.as; a.gf += m.as; a.ga += m.hs;
                        if(m.hs > m.as) { h.w++; h.pts += 3; a.l++; }
                        else if(m.as > m.hs) { a.w++; a.pts += 3; h.l++; }
                        else { h.d++; a.d++; h.pts += 1; a.pts += 1; }
                        h.gd = h.gf - h.ga; a.gd = a.gf - a.ga;
                    }
                });
            });

            const stats = Object.values(statsMap).filter(s => {
                const team = window.state.teams.find(t => t.id === s.id);
                return team && team.name.trim() !== "";
            }).sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);

            container.innerHTML = `
                <div class="bg-zinc-900/40 rounded-[2rem] border border-white/5 overflow-hidden overflow-x-auto no-scrollbar">
                    <table class="w-full text-left min-w-[650px]">
                        <thead>
                            <tr class="text-[8px] uppercase font-black text-zinc-500 border-b border-white/5 bg-white/[0.02]">
                                <th class="p-5 pl-8">Pos Manager</th>
                                <th class="p-5 text-center">P</th><th class="p-5 text-center">W</th><th class="p-5 text-center">D</th><th class="p-5 text-center">L</th>
                                <th class="p-5 text-center">GF</th><th class="p-5 text-center">GA</th><th class="p-5 text-center">GD</th>
                                <th class="p-5 text-center text-blue-500">Pts</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${stats.map((s,i) => {
                                const team = window.state.teams.find(t => t.id === s.id) || {};
                                const placeholderUrl = `https://placehold.co/40x40/1f2937/ffffff?text=${encodeURIComponent(s.name.substring(0,2).toUpperCase())}`;
                                return `
                                <tr class="border-b border-white/[0.02] ${i < 8 ? 'bg-green-500/5' : (i < 24 ? 'bg-blue-500/5' : '')}">
                                    <td class="p-4 pl-8 flex items-center gap-3">
                                        <span class="text-[10px] font-black ${i < 8 ? 'text-green-500' : (i < 24 ? 'text-blue-500' : 'opacity-20')}">${i+1}</span>
                                        <img src="${team.logo || placeholderUrl}" 
                                             onerror="this.onerror=null; this.src='${placeholderUrl}'" 
                                             class="w-6 h-6 object-contain flex-shrink-0 bg-zinc-950/30 p-0.5 rounded-md">
                                        <span class="text-xs font-bold text-zinc-200 truncate max-w-[150px]">${s.name}</span>
                                    </td>
                                    <td class="p-4 text-center text-zinc-400 text-[11px]">${s.p}</td>
                                    <td class="p-4 text-center text-zinc-400 text-[11px]">${s.w}</td>
                                    <td class="p-4 text-center text-zinc-400 text-[11px]">${s.d}</td>
                                    <td class="p-4 text-center text-zinc-400 text-[11px]">${s.l}</td>
                                    <td class="p-4 text-center text-zinc-400 text-[11px]">${s.gf}</td>
                                    <td class="p-4 text-center text-zinc-400 text-[11px]">${s.ga}</td>
                                    <td class="p-4 text-center font-bold text-[11px] ${s.gd > 0 ? 'text-emerald-500' : (s.gd < 0 ? 'text-red-500' : 'text-zinc-500')}">${s.gd > 0 ? '+' + s.gd : s.gd}</td>
                                    <td class="p-4 text-center font-black text-blue-500 text-base">${s.pts}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        };

        const renderSetup = (container) => {
            if (window.state.teams.length < 48) {
                for (let i = window.state.teams.length; i < 48; i++) {
                    window.state.teams.push({ id: i, name: initialTeams[i]?.name || "", logo: initialTeams[i]?.logo || "" });
                }
            }

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-zinc-900/60 p-5 rounded-[2rem] border border-white/5">
                        <div class="flex justify-between items-center mb-4 px-2">
                            <h3 class="text-[11px] font-black uppercase text-blue-500 tracking-widest">Fixed Teams Registration (48 Slots)</h3>
                            <span class="text-[10px] font-bold text-zinc-500">${window.state.teams.filter(t => t.name.trim() !== "").length} / 48</span>
                        </div>
                        <div class="grid grid-cols-1 gap-2 max-h-[60vh] overflow-y-auto pr-2 custom-scroll">
                            ${window.state.teams.map(t => {
                                const placeholderUrl = `https://placehold.co/40x40/1f2937/ffffff?text=${encodeURIComponent((t.name || "T").substring(0,2).toUpperCase())}`;
                                return `
                                <div class="flex items-center gap-3 bg-black/40 p-2 rounded-xl border border-white/5 group hover:border-blue-500/30 transition-all">
                                    <span class="text-[10px] w-8 text-center font-black ${t.name ? 'text-blue-500' : 'text-zinc-700'}">${t.id+1}</span>
                                    <img src="${t.logo || placeholderUrl}" 
                                         onerror="this.onerror=null; this.src='${placeholderUrl}'" 
                                         class="w-6 h-6 object-contain flex-shrink-0 bg-zinc-950/30 p-0.5 rounded-md">
                                    <input type="text" 
                                           value="${t.name || ''}" 
                                           onchange="updateTeamName(${t.id}, this.value)" 
                                           class="flex-1 bg-transparent text-sm font-bold outline-none placeholder:text-zinc-800 text-zinc-200" 
                                           placeholder="Enter Team Name">
                                    ${t.name ? `<div class="w-1.5 h-1.5 rounded-full bg-blue-500 mr-2 shadow-[0_0_8px_rgba(59,130,246,0.5)]"></div>` : ''}
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="generateFixtures()" class="py-4 bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all rounded-2xl font-black text-[10px] uppercase tracking-widest shadow-xl shadow-blue-600/20">Generate 4 Rounds</button>
                        <button onclick="startLeague()" class="py-4 bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition-all rounded-2xl font-black text-[10px] uppercase tracking-widest shadow-xl shadow-emerald-600/20">Start League</button>
                    </div>
                    <button onclick="resetTournament()" class="w-full py-4 bg-red-600/10 hover:bg-red-600/20 text-red-500 rounded-2xl font-black text-[9px] uppercase tracking-widest border border-red-500/10 transition-all">Reset All Tournament Data</button>
                </div>`;
        };

        const renderRounds = (container) => {
            if(!window.state.isLeagueStarted) { 
                container.innerHTML = `<div class="py-20 text-center opacity-40 italic text-sm">League Phase မစတင်ရသေးပါ။ Admin Panel တွင် Start လုပ်ပါ။</div>`; 
                return; 
            }
            const rIdx = window.state.currentRound - 1;
            const r = window.state.rounds[rIdx] || { matches: [] };
            container.innerHTML = `
                <div class="flex items-center justify-between mb-6 bg-zinc-900/50 p-2 rounded-2xl border border-white/5">
                    <button onclick="moveRound(-1)" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/5 active:scale-90 transition-all">←</button>
                    <div class="text-center"><span class="text-[10px] font-black uppercase tracking-widest text-blue-500">Matchday ${window.state.currentRound}</span></div>
                    <button onclick="moveRound(1)" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/5 active:scale-90 transition-all">→</button>
                </div>
                <div class="space-y-2">
                    ${r.matches.length === 0 ? `<div class="py-10 text-center opacity-30 text-[10px]">ပွဲစဉ်များ မရှိသေးပါ</div>` : ''}
                    ${r.matches.map((m, i) => {
                        const hT = window.state.teams.find(t => t.id === m.h) || { name: 'TBA', logo: "" };
                        const aT = window.state.teams.find(t => t.id === m.a) || { name: 'TBA', logo: "" };
                        
                        const hTPlaceholder = `https://placehold.co/40x40/1f2937/ffffff?text=${encodeURIComponent(hT.name.substring(0,2).toUpperCase())}`;
                        const aTPlaceholder = `https://placehold.co/40x40/1f2937/ffffff?text=${encodeURIComponent(aT.name.substring(0,2).toUpperCase())}`;

                        let hsColor = 'text-white', asColor = 'text-white';
                        if (m.hs !== null && m.as !== null) {
                            if (m.hs > m.as) { hsColor = 'text-emerald-500'; asColor = 'text-red-500'; }
                            else if (m.as > m.hs) { asColor = 'text-emerald-500'; hsColor = 'text-red-500'; }
                            else { hsColor = 'text-yellow-500'; asColor = 'text-yellow-500'; }
                        }
                        return `
                        <div class="bg-zinc-900/40 p-3 rounded-2xl border border-white/5 flex items-center gap-3">
                            <div class="flex-1 flex items-center justify-end gap-2 text-right font-bold text-[11px] truncate text-zinc-100">
                                <span class="truncate">${hT.name}</span>
                                <img src="${hT.logo || hTPlaceholder}" 
                                     onerror="this.onerror=null; this.src='${hTPlaceholder}'" 
                                     class="w-5 h-5 object-contain flex-shrink-0 bg-zinc-950/30 p-0.5 rounded-md">
                            </div>
                            <div class="flex gap-1.5 items-center">
                                <input type="number" value="${m.hs ?? ''}" onchange="updateScore(${rIdx}, ${i}, 'hs', this.value)" ${!window.state.isAdmin?'readonly':''} 
                                    class="w-8 h-8 bg-black rounded-lg text-center font-black border border-white/10 outline-none ${hsColor}">
                                <span class="opacity-10 text-[6px] font-black">VS</span>
                                <input type="number" value="${m.as ?? ''}" onchange="updateScore(${rIdx}, ${i}, 'as', this.value)" ${!window.state.isAdmin?'readonly':''} 
                                    class="w-8 h-8 bg-black rounded-lg text-center font-black border border-white/10 outline-none ${asColor}">
                            </div>
                            <div class="flex-1 flex items-center justify-start gap-2 text-left font-bold text-[11px] truncate text-zinc-100">
                                <img src="${aT.logo || aTPlaceholder}" 
                                     onerror="this.onerror=null; this.src='${aTPlaceholder}'" 
                                     class="w-5 h-5 object-contain flex-shrink-0 bg-zinc-950/30 p-0.5 rounded-md">
                                <span class="truncate">${aT.name}</span>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            `;
        };

        const renderPOTR = (container) => {
            const rd = window.state.potr[window.state.currentRound] || { name: 'TBA', gf: 0, ga: 0, img: '' };
            container.innerHTML = `
                <div class="bg-zinc-900/80 p-8 rounded-[3rem] border border-white/5 text-center relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-50"></div>
                    <p class="text-[9px] font-black text-blue-500 uppercase tracking-[0.3em] mb-8">Matchday ${window.state.currentRound} MVP</p>
                    <div class="relative w-44 h-44 mx-auto mb-8">
                        <div class="w-full h-full rounded-full bg-blue-600/5 border-2 border-white/5 overflow-hidden flex items-center justify-center p-1">
                            <div class="w-full h-full rounded-full overflow-hidden bg-zinc-800 flex items-center justify-center">
                                ${rd.img ? `<img src="${rd.img}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-4xl opacity-20">🏆</div>`}
                            </div>
                        </div>
                        ${window.state.isAdmin ? `
                        <label class="absolute bottom-1 right-1 w-12 h-12 bg-blue-600 rounded-full border-4 border-black flex items-center justify-center cursor-pointer hover:scale-110 active:scale-90 transition-all shadow-xl">
                            <span class="text-xs">📷</span> 
                            <input type="file" class="hidden" accept="image/*" onchange="handleImageUpload(event)">
                        </label>` : ''}
                    </div>
                    
                    <!-- Compression status indicator -->
                    <div id="upload-status" class="hidden text-zinc-400 text-[10px] animate-pulse mb-4">ပုံကို ချုံ့ပြီး တင်ဆက်နေပါသည်...</div>

                    <input type="text" placeholder="Manager Name" value="${rd.name}" onchange="updatePOTR('name', this.value)" ${!window.state.isAdmin?'readonly':''} class="bg-transparent text-3xl font-black text-white text-center w-full outline-none mb-8 placeholder:text-zinc-800">
                    <div class="flex justify-center gap-4">
                        <div class="bg-black/40 px-6 py-5 rounded-[1.5rem] border border-white/5 min-w-[80px]">
                            <span class="text-[8px] font-black text-zinc-500 uppercase block mb-1">Goals</span>
                            <input type="number" value="${rd.gf}" onchange="updatePOTR('gf', this.value)" ${!window.state.isAdmin?'readonly':''} class="bg-transparent w-full text-center font-black text-2xl text-emerald-500 outline-none">
                        </div>
                        <div class="bg-black/40 px-6 py-5 rounded-[1.5rem] border border-white/5 min-w-[80px]">
                            <span class="text-[8px] font-black text-zinc-500 uppercase block mb-1">Conceded</span>
                            <input type="number" value="${rd.ga}" onchange="updatePOTR('ga', this.value)" ${!window.state.isAdmin?'readonly':''} class="bg-transparent w-full text-center font-black text-2xl text-red-500 outline-none">
                        </div>
                    </div>
                </div>
            `;
        };

        const renderKnockout = (container) => {
            const stages = [{ id: 'playoffs', label: 'Play-offs' }, { id: 'r16', label: 'Round of 16' }, { id: 'qf', label: 'Quarter Final' }, { id: 'sf', label: 'Semi Final' }, { id: 'final', label: 'Final' }];
            container.innerHTML = `<div class="space-y-10 pb-10">${stages.map(s => `
                <div class="space-y-4">
                    <h3 class="text-[10px] font-black uppercase text-blue-500 tracking-[0.3em] pl-4 border-l-2 border-blue-600">${s.label}</h3>
                    <div class="grid gap-3">${renderKOList(s.id)}</div>
                    ${window.state.isAdmin ? `<button onclick="addKOMatch('${s.id}')" class="w-full py-3 bg-white/[0.02] border border-dashed border-white/10 rounded-2xl text-[8px] font-black text-zinc-500 hover:text-zinc-300 transition-all">+ Add ${s.label} Match</button>` : ''}
                </div>`).join('')}</div>`;
        };

        const renderKOList = (stageId) => {
            const matches = window.state.knockout[stageId] || [];
            if (matches.length === 0) return `<p class="text-[9px] opacity-20 px-4 italic">To Be Announced</p>`;
            return matches.map((m, idx) => {
                let s1Color = 'text-white', s2Color = 'text-white';
                if (m.s1 !== null && m.s2 !== null) {
                    if (m.s1 > m.s2) { s1Color = 'text-emerald-500'; s2Color = 'text-red-500'; }
                    else if (m.s2 > m.s1) { s2Color = 'text-emerald-500'; s1Color = 'text-red-500'; }
                    else { s1Color = 'text-yellow-500'; s2Color = 'text-yellow-500'; }
                }
                return `
                <div class="bg-zinc-900/60 p-4 rounded-3xl border border-white/5 flex items-center justify-between gap-4">
                    <div class="flex-1 space-y-2">
                        <input type="text" value="${m.t1 || ''}" onchange="updateKOMatch('${stageId}', ${idx}, 't1', this.value)" ${!window.state.isAdmin?'readonly':''} class="w-full bg-transparent text-sm font-bold outline-none placeholder:text-zinc-800 text-zinc-100" placeholder="Team 1">
                        <input type="text" value="${m.t2 || ''}" onchange="updateKOMatch('${stageId}', ${idx}, 't2', this.value)" ${!window.state.isAdmin?'readonly':''} class="w-full bg-transparent text-sm font-bold outline-none placeholder:text-zinc-800 text-zinc-100" placeholder="Team 2">
                    </div>
                    <div class="flex flex-col gap-2">
                        <input type="number" value="${m.s1 ?? ''}" onchange="updateKOMatch('${stageId}', ${idx}, 's1', this.value)" ${!window.state.isAdmin?'readonly':''} class="w-10 h-8 bg-black rounded-lg text-center text-sm font-black border border-white/5 outline-none ${s1Color}">
                        <input type="number" value="${m.s2 ?? ''}" onchange="updateKOMatch('${stageId}', ${idx}, 's2', this.value)" ${!window.state.isAdmin?'readonly':''} class="w-10 h-8 bg-black rounded-lg text-center text-sm font-black border border-white/5 outline-none ${s2Color}">
                    </div>
                    ${window.state.isAdmin ? `<button onclick="deleteKOMatch('${stageId}', ${idx})" class="text-red-500/20 hover:text-red-500 px-2 text-lg transition-colors">×</button>` : ''}
                </div>`;
            }).join('');
        };

        const renderModal = () => {
            const modalContainer = document.getElementById('modal-container');
            if (!modalContainer) return;
            const m = window.state.modal;
            if (!m.isOpen) {
                modalContainer.innerHTML = '';
                return;
            }

            modalContainer.innerHTML = `
                <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[250] flex items-center justify-center p-4">
                    <div class="bg-zinc-950 border border-white/10 rounded-[2rem] p-6 w-full max-w-sm text-center shadow-2xl transition-all">
                        <h4 class="text-sm font-black uppercase text-blue-500 tracking-wider mb-2">${m.title}</h4>
                        <p class="text-xs text-zinc-300 font-bold mb-6 leading-relaxed">${m.message}</p>
                        <div class="flex gap-3 justify-center">
                            ${m.showCancel ? `
                                <button onclick="window.closeModal()" class="flex-1 py-3 bg-zinc-900 hover:bg-zinc-800 active:scale-95 transition-all rounded-xl text-[10px] font-black uppercase tracking-widest text-zinc-400 border border-white/5">မလုပ်တော့ပါ</button>
                            ` : ''}
                            <button id="modal-confirm-btn" class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all rounded-xl text-[10px] font-black uppercase tracking-widest text-white shadow-lg shadow-blue-600/20">အတည်ပြုသည်</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-confirm-btn').onclick = m.onConfirm;
        };

        window.updateTeamName = (id, name) => { 
            window.state.teams[id].name = name; 
            // အကယ်၍ Admin က နာမည်အသစ်ပြင်ရိုက်လျှင် Fixed Team List ထဲမှာ ရှာပြီး Logo ကိုပါ ပြိုင်တူပြောင်းပေးရန်
            const matchedTeam = fixedTeams.find(ft => ft.name.toLowerCase() === name.trim().toLowerCase());
            if (matchedTeam) {
                window.state.teams[id].logo = matchedTeam.logo;
            } else {
                window.state.teams[id].logo = ""; // Fallback will auto render letter initials
            }
            saveToCloud(); 
            refreshUI(); 
        };

        // Circle Method (Round Robin) ကို သုံးပြီး Match များကို စနစ်တကျ ထုတ်လုပ်ခြင်း
        window.generateFixtures = () => {
            const activeTeams = window.state.teams.filter(t => t.name.trim() !== "");
            if (activeTeams.length < 2) {
                window.showModal("သတိပေးချက်", "Manager အနည်းဆုံး ၂ ဦး လိုအပ်ပါသည်", () => window.closeModal(), false);
                return;
            }

            window.showModal(
                "ပွဲစဉ်ဇယား ထုတ်ရန် အတည်ပြုချက်",
                `လက်ရှိ စာရင်းသွင်းထားသူ Manager ${activeTeams.length} ဦးအတွက် အချင်းချင်း ပွဲစဉ်လုံးဝမထပ်စေဘဲ Round 4 အထိ Fixtures များ စနစ်တကျ ဖန်တီးမလား?`,
                () => {
                    window.state.rounds = Array.from({length: 4}, (_, i) => ({ round: i + 1, matches: [] }));

                    let scheduleTeams = [...activeTeams].sort(() => Math.random() - 0.5);
                    let N = scheduleTeams.length;
                    
                    let hasBye = N % 2 !== 0;
                    if (hasBye) {
                        scheduleTeams.push({ id: -1, name: "BYE" });
                        N++;
                    }

                    const maxPossibleRounds = N - 1;
                    const roundsToCreate = Math.min(4, maxPossibleRounds);

                    for (let r = 0; r < roundsToCreate; r++) {
                        const roundMatches = [];
                        
                        for (let i = 0; i < N / 2; i++) {
                            const home = scheduleTeams[i];
                            const away = scheduleTeams[N - 1 - i];

                            if (home.id !== -1 && away.id !== -1) {
                                roundMatches.push({
                                    h: home.id,
                                    a: away.id,
                                    hs: null,
                                    as: null
                                });
                            }
                        }

                        window.state.rounds[r].matches = roundMatches.sort(() => Math.random() - 0.5);

                        // Rotation logic (အညွှန်း 0 ကို ပုံသေထား၍ လှည့်ခြင်း)
                        scheduleTeams = [
                            scheduleTeams[0],
                            scheduleTeams[N - 1],
                            ...scheduleTeams.slice(1, N - 1)
                        ];
                    }

                    window.state.isLeagueStarted = true;
                    window.state.currentRound = 1;
                    saveToCloud();
                    window.closeModal();
                    refreshUI();
                },
                true
            );
        };

        window.updateScore = (rIdx, mIdx, side, val) => { window.state.rounds[rIdx].matches[mIdx][side] = val === "" ? null : parseInt(val); saveToCloud(); refreshUI(); };
        window.updatePOTR = (field, val) => { const cur = window.state.currentRound; if(!window.state.potr[cur]) window.state.potr[cur] = { name: '', gf: 0, ga: 0, img: '' }; window.state.potr[cur][field] = field === 'name' ? val : (val === "" ? 0 : parseInt(val)); saveToCloud(); refreshUI(); };
        
        // HTML Canvas ကိုအသုံးပြုပြီး ပုံကို Max 400x400 JPG, Quality 70% ဖြင့် Compression လုပ်ခြင်း
        const compressImage = (base64Str, maxWidth = 400, maxHeight = 400) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Firestore Document Capacity Limits ကို ကာကွယ်ရန် lightweight jpeg ပုံစံဖြင့် Export ထုတ်မည်
                    resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                };
            });
        };

        window.handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const statusIndicator = document.getElementById('upload-status');
            if (statusIndicator) statusIndicator.classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    // မူရင်း Base64 အား dynamic canvas အသုံးပြု၍ ချုံ့ပစ်ခြင်း
                    const compressedDataUrl = await compressImage(event.target.result);
                    
                    const cur = window.state.currentRound;
                    if(!window.state.potr[cur]) window.state.potr[cur] = { name: '', gf: 0, ga: 0, img: '' };
                    window.state.potr[cur].img = compressedDataUrl;
                    
                    await saveToCloud();
                    if (statusIndicator) statusIndicator.classList.add('hidden');
                    refreshUI();
                } catch (error) {
                    console.error("Image compression error: ", error);
                    if (statusIndicator) statusIndicator.classList.add('hidden');
                    window.showModal("Error", "ပုံတင်ရာတွင် ချွတ်ယွင်းမှုရှိနေပါသည်", () => window.closeModal(), false);
                }
            };
            reader.readAsDataURL(file);
        };

        window.startLeague = () => { window.state.isLeagueStarted = true; saveToCloud(); refreshUI(); };
        
        window.resetTournament = () => {
            window.showModal(
                "Data အားလုံး ဖျက်ပစ်ရန် အတည်ပြုချက်",
                "ပြိုင်ပွဲဝင် စာရင်းများ၊ ရမှတ်ဇယားများနှင့် ပွဲစဉ်ဇယားများ အားလုံးကို ဖျက်ပြီး မူလအတိုင်း (Fixed Teams/Logos များဖြင့်) ပြန်လည်စတင်ရန် သေချာပါသလား?",
                () => {
                    window.state.isLeagueStarted = false;
                    window.state.rounds = Array.from({length: 4}, (_, i) => ({ round: i + 1, matches: [] }));
                    window.state.knockout = { playoffs: [], r16: [], qf: [], sf: [], final: [] };
                    window.state.potr = {};
                    window.state.teams = [...initialTeams];
                    saveToCloud();
                    window.closeModal();
                    refreshUI();
                },
                true
            );
        };

        window.addKOMatch = (stage) => { window.state.knockout[stage].push({ t1: '', t2: '', s1: null, s2: null }); saveToCloud(); refreshUI(); };
        
        window.deleteKOMatch = (stage, idx) => {
            window.showModal(
                "ပွဲစဉ်ဖျက်ရန် အတည်ပြုချက်",
                "ရွေးချယ်ထားသော Knockout ပွဲစဉ်ကို ဖျက်ပစ်ရန် သေချာပါသလား?",
                () => {
                    window.state.knockout[stage].splice(idx, 1);
                    saveToCloud();
                    window.closeModal();
                    refreshUI();
                },
                true
            );
        };

        window.updateKOMatch = (stage, idx, field, val) => { window.state.knockout[stage][idx][field] = field.startsWith('s') ? (val === "" ? null : parseInt(val)) : val; saveToCloud(); refreshUI(); };
        window.changeTab = t => { window.state.activeTab = t; refreshUI(); };
        window.moveRound = d => { const n = window.state.currentRound + d; if(n > 0 && n <= 4) { window.state.currentRound = n; refreshUI(); } };
        
        window.adminLogin = () => {
            const pass = prompt("Password?");
            if(pass === "1234") {
                window.state.isAdmin = true;
                refreshUI();
            } else if (pass !== null) {
                window.showModal("သတိပေးချက်", "မှားယွင်းသော စကားဝှက် ဖြစ်သည်", () => window.closeModal(), false);
            }
        };

        window.logoutAdmin = () => { window.state.isAdmin = false; refreshUI(); };
        window.renderHeader = () => { document.getElementById('admin-status').innerHTML = window.state.isAdmin ? `<button onclick="logoutAdmin()" class="px-3 py-1 bg-blue-600/10 text-blue-500 text-[8px] font-black rounded-full border border-blue-500/20 uppercase">Admin Mode</button>` : `<button onclick="adminLogin()" class="px-3 py-1 bg-white/5 text-zinc-500 text-[8px] font-black rounded-full uppercase">Login</button>`; };

        // Telegram Floating Bubble ဆွဲရွှေ့နိုင်ရန် Logic
        let isDragging = false;
        const initDraggable = () => {
            const dragEl = document.getElementById('draggable-result');
            let currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
            let dragStartTime;

            const dragStart = (e) => {
                dragStartTime = Date.now();
                if (e.type === "touchstart") {
                    initialX = e.touches[0].clientX - xOffset;
                    initialY = e.touches[0].clientY - yOffset;
                } else {
                    initialX = e.clientX - xOffset;
                    initialY = e.clientY - yOffset;
                }
                if (e.target === dragEl || dragEl.contains(e.target)) isDragging = true;
            };

            const dragEnd = () => {
                initialX = currentX;
                initialY = currentY;
                const dragDuration = Date.now() - dragStartTime;
                
                // တချက်နှိပ်ရုံသာ ဖြစ်ပါက သက်ဆိုင်ရာ Telegram Link သို့သွားရန်
                if (isDragging && dragDuration < 200) {
                   window.open('https://t.me/agust_nadi', '_blank');
                }
                
                isDragging = false;
            };

            const drag = (e) => {
                if (isDragging) {
                    e.preventDefault();
                    if (e.type === "touchmove") {
                        currentX = e.touches[0].clientX - initialX;
                        currentY = e.touches[0].clientY - initialY;
                    } else {
                        currentX = e.clientX - initialX;
                        currentY = e.clientY - initialY;
                    }
                    xOffset = currentX; yOffset = currentY;
                    setTranslate(currentX, currentY, dragEl);
                }
            };

            const setTranslate = (xPos, yPos, el) => { el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`; };

            dragEl.addEventListener("mousedown", dragStart, false);
            window.addEventListener("mouseup", dragEnd, false);
            window.addEventListener("mousemove", drag, false);
            
            dragEl.addEventListener("touchstart", dragStart, {passive: false});
            window.addEventListener("touchend", dragEnd, false);
            window.addEventListener("touchmove", drag, {passive: false});
        };

        window.onload = () => { refreshUI(); initDraggable(); };
    </script>
    <style>

        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 10px; }
        
        .floating-nav-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; z-index: 100; }
        .floating-nav { background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 2.5rem; height: 76px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: space-around; padding: 0 12px; }

        .result-bubble {
            position: fixed;
            right: 20px;
            top: 50%;

            background: #0088cc;
            border-radius: 50%;

            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 136, 204, 0.4), 0 0 0 4px rgba(255, 255, 255, 0.05);
            cursor: grab;
            z-index: 150;
            user-select: none;
            touch-action: none;
            transition: transform 0.1s ease-out, scale 0.2s;
        }
        .result-bubble:active { cursor: grabbing; scale: 0.95; }

        @keyframes pulse { 0%, 100% { box-shadow: 0 10px 25px rgba(0, 136, 204, 0.4); } 50% { box-shadow: 0 10px 35px rgba(0, 136, 204, 0.7); } }
        .result-bubble { animation: pulse 2s infinite; }

        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>

<body class="max-w-md mx-auto min-h-screen border-x border-white/5 relative bg-[radial-gradient(circle_at_50%_-10%,rgba(59,130,246,0.15),transparent_60%)] pb-32">
    
    <div class="px-6 py-6 flex justify-between items-center">
        <div class="text-[9px] font-black text-blue-500/60 uppercase tracking-[0.3em]">Official Website</div>
        <div id="admin-status"></div>
    </div>
    
    <header class="px-6 mb-10">
        <h1 class="text-5xl font-black italic tracking-tighter leading-none mb-1">PRO LEAGUE<br><span class="text-blue-600">Season 5</span></h1>
        <p class="text-[9px] font-black text-zinc-500 uppercase tracking-[0.3em]">the one community</p>
    </header>

    <main id="content" class="px-4"></main>

    <!-- Draggable Floating Result Bubble with Telegram Link -->
    <div id="draggable-result" class="result-bubble">
        <svg viewBox="0 0 24 24" class="w-6 h-6 text-white mb-0.5" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .33z"/>
        </svg>
